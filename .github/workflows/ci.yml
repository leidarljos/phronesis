name: ci

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meson-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            capnproto libcmocka-dev \
            build-essential git
      - name: Configure
        run: meson setup build
      - name: Compile
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: Stage library artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          test -f build/libphronesis.a
          cp -f build/libphronesis.a dist/libphronesis.a
          cp -f schema/SCHEMA_PIN schema/policy.capnp schema/util.capnp dist/
          python3 scripts/publish_static_lib.py
        env:
          PHRONESIS_STATIC_LIB: ${{ github.workspace }}/dist/libphronesis.a
          PHRONESIS_PUBLISH_DRY_RUN: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: phronesis
          path: dist/
          if-no-files-found: error
          retention-days: 30

  snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: meson-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phronesis
          path: dist
      - name: Publish snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Snapshot from ${GITHUB_SHA} on main."
          if gh release view snapshot >/dev/null 2>&1; then
            gh release edit snapshot --notes "${notes}" --prerelease
          else
            gh release create snapshot \
              --prerelease \
              --title "phronesis snapshot" \
              --notes "${notes}"
          fi
          gh release upload snapshot --clobber \
            dist/libphronesis.a \
            dist/SCHEMA_PIN \
            dist/policy.capnp \
            dist/util.capnp

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: meson-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require tag to match VERSION
        run: |
          set -euo pipefail
          ver="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != "v${ver}" ]]; then
            echo "error: tag ${tag} does not match VERSION ${ver} (want v${ver})" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: phronesis
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "phronesis ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/libphronesis.a \
            dist/SCHEMA_PIN \
            dist/policy.capnp \
            dist/util.capnp
