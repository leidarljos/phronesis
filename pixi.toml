# Reproducible grok-policyd env for local dogfood, rg.terra, and GitLab CI.
# Install: pixi install --locked
# Build:   pixi run build
# Test:    pixi run test
# Backend: Meson only (see AGENTS.md). Host C unit tests: cmocka only.

[workspace]
name = "grok-policyd"
version = "0.1.0"
description = "GrokOS multi-agent policy supervisor TCB — stable C ABI"
authors = ["GrokOS contributors"]
channels = ["https://repo.prefix.dev/rg-forge", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
compilers = ">=1.9.0,<2"
binutils = ">=2.40"
meson = ">=1.3,<2"
ninja = ">=1.11,<2"
pkg-config = ">=0.29,<1"
libsystemd = "*"
libcap = "*"
capnproto = ">=1.0"
# HaoZeke pure-C Cap'n (rg-forge); not conda-forge
c-capnproto = ">=0.1.0,<0.2"
cmocka = ">=1.1.7,<2"
# Cap'n peer transport (nng req/rep over ipc://)
nng = ">=1.11,<2"
bash = ">=5.2"
coreutils = ">=9.5"
sed = "*"
which = "*"
git = ">=2.40"
# check_shared_libs uses readelf

[tasks]
env-info = "bash scripts/pixi_env_info.sh"
clean = "rm -rf build"
# setup once if needed; compile + test always
setup = { cmd = "bash -c 'if [ -f build/build.ninja ]; then meson setup build --reconfigure; else meson setup build; fi'" }
compile = { cmd = "meson compile -C build", depends-on = ["setup"] }
lib = { cmd = "meson compile -C build grok_policyd", depends-on = ["setup"] }
test = { cmd = "meson compile -C build && meson test -C build --print-errorlogs", depends-on = ["setup"] }
example = { cmd = "meson compile -C build example_minimal", depends-on = ["setup"] }
build = { depends-on = ["test", "example"] }
cli = { cmd = "meson compile -C build grok-policyd", depends-on = ["setup"] }
install = { cmd = "meson install -C build", depends-on = ["compile"] }
pc = { cmd = "meson compile -C build", depends-on = ["setup"] }
ci = { depends-on = ["env-info", "build"] }

[feature.docs.dependencies]
doxygen = ">=1.11,<2"
python = ">=3.12,<3.14"
pip = "*"

[feature.docs.pypi-dependencies]
sphinx = ">=7.2,<9"
breathe = ">=4.35,<5"
furo = ">=2024.1.29"
myst-parser = ">=2.0,<5"

[feature.docs.tasks]
doxygen = "bash -c 'command -v doxygen >/dev/null && mkdir -p docs/build/doxygen && cd docs && doxygen Doxyfile'"
docs-html = "sphinx-build -W -b html docs/source docs/build/html"
docs = { depends-on = ["doxygen", "docs-html"] }

[environments]
default = { solve-group = "default" }
ci = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
