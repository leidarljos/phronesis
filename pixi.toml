[workspace]
name = "phronesis"
version = "0.1.0"
description = "In-process policy library — Cap'n FFI + C ABI"
authors = ["<ENTER-GROUP-NAME-HERE>"]
channels = ["https://repo.prefix.dev/rg-forge", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
compilers = ">=1.9.0,<2"
binutils = ">=2.40"
meson = ">=1.3,<2"
ninja = ">=1.11,<2"
pkg-config = ">=0.29,<1"
capnproto = ">=1.0"
c-capnproto = ">=0.1.0,<0.2"
cmocka = ">=1.1.7,<2"
gcovr = ">=8.0,<9"
bash = ">=5.2"
coreutils = ">=9.5"
sed = "*"
which = "*"
git = ">=2.40"
python = ">=3.12,<3.14"
just = "==1.57.0"

[tasks]
env-info = "bash scripts/pixi_env_info.sh"
clean = "rm -rf build build-cov coverage-out"
setup = { cmd = "bash -c 'opts=\"${POLICYD_MESON_OPTS:-}\"; if [ -f build/build.ninja ]; then meson setup build --reconfigure $opts; else meson setup build $opts; fi'" }
compile = { cmd = "meson compile -C build", depends-on = ["setup"] }
# Both shared + static (default_library=both); name disambiguated for Meson.
lib = { cmd = "meson compile -C build phronesis:shared_library phronesis:static_library", depends-on = ["setup"] }
test = { cmd = "meson compile -C build && meson test -C build --print-errorlogs", depends-on = ["setup"] }
example = { cmd = "meson compile -C build example_minimal", depends-on = ["setup"] }
build = { depends-on = ["test", "example"] }
cli = { cmd = "meson compile -C build phronesis", depends-on = ["setup"] }
install = { cmd = "meson install -C build", depends-on = ["compile"] }
coverage = "bash scripts/coverage.sh"
ci = { depends-on = ["build"] }


# Playground WASM (emcc on PATH; run on rg.terra, not laptop). Multi-pack MEMFS seed.
playground-wasm = "bash playground/wasm/build.sh"
playground-smoke = { cmd = "node playground/scripts/wasm-smoke.mjs", depends-on = ["playground-wasm"] }
playground-parity = "node playground/scripts/parity-node.mjs"
playground-dev = "bash -c 'cd playground/astro && npm ci && npm run dev'"
playground-build = "bash playground/scripts/build-site.sh"
# JS quality (Biome + tsc); no emcc. From this repo root:
#   pixi run playground-check
playground-check = "bash -c 'cd playground/astro && npm ci && npm run check'"

[environments]
default = { solve-group = "default" }
ci = { solve-group = "default" }
