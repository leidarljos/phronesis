[workspace]
name = "grok-policyd"
version = "0.1.0"
description = "GrokOS multi-agent policy TCB — Cap'n FFI + C ABI"
authors = ["GrokOS contributors"]
channels = ["https://repo.prefix.dev/rg-forge", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
compilers = ">=1.9.0,<2"
binutils = ">=2.40"
meson = ">=1.3,<2"
ninja = ">=1.11,<2"
pkg-config = ">=0.29,<1"
capnproto = ">=1.0"
c-capnproto = ">=0.1.0,<0.2"
cmocka = ">=1.1.7,<2"
gcovr = ">=8.0,<9"
bash = ">=5.2"
coreutils = ">=9.5"
sed = "*"
which = "*"
git = ">=2.40"

[tasks]
env-info = "bash scripts/pixi_env_info.sh"
clean = "rm -rf build build-cov coverage-out"
setup = { cmd = "bash -c 'if [ -f build/build.ninja ]; then meson setup build --reconfigure; else meson setup build; fi'" }
compile = { cmd = "meson compile -C build", depends-on = ["setup"] }
lib = { cmd = "meson compile -C build grok_policyd", depends-on = ["setup"] }
test = { cmd = "meson compile -C build && meson test -C build --print-errorlogs", depends-on = ["setup"] }
example = { cmd = "meson compile -C build example_minimal", depends-on = ["setup"] }
build = { depends-on = ["test", "example"] }
cli = { cmd = "meson compile -C build grok-policyd", depends-on = ["setup"] }
install = { cmd = "meson install -C build", depends-on = ["compile"] }
coverage = "bash scripts/coverage.sh"
ci = { depends-on = ["build"] }

[environments]
default = { solve-group = "default" }
ci = { solve-group = "default" }
