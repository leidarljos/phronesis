stages: [validate]

# Signed commits required (GrokOS project policy / Ali RFC).
# Enforced via GitLab signature API — does not force manual merge.
commits:signed:
  stage: validate
  image: python:3.12-alpine
  variables:
    GIT_DEPTH: "100"
  before_script:
    - apk add --no-cache bash curl git
  script:
    - ./scripts/check-signed-commits.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

validate:tree:
  stage: validate
  image: alpine:3.20
  script:
    - test -f README.md
    - if [ -d packaging ]; then test -d packaging; fi
    - echo "package tree OK"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

