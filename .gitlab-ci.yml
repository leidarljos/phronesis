# Host hygiene: tools just door (signed-commits + secrets).
include:
  - project: 'trace-analysis/grokos-packages/grokos-tools'
    ref: main
    file: '/ci-kit/bootstrap/package-validate.gitlab-ci.yml'

# Reproducible via pixi (pixi.lock). Host C library + cmocka tests + full docs.
stages: [validate, build, deploy]


# ENOSPC on grokos-ci-packages host: re-queue so GitLab can land on keel
# (keel still has disk; packages runners fail at docker prepare).
default:
  retry:
    max: 2
    when:
      - runner_system_failure
# Cancel redundant pipelines on the same ref when a newer commit is pushed.
# Jobs must be interruptible: true for running work to stop (not only pending).
workflow:
  auto_cancel:
    on_new_commit: interruptible

variables:
  FF_USE_FASTZIP: "true"
  RATTLER_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/rattler
  PIXI_HOME: ${CI_PROJECT_DIR}/.cache/pixi-home

# Shared apt+pixi bootstrap (same retry shape as grokos-session / build:pixi).
.pixi_bootstrap: &pixi_bootstrap |
  set -euo pipefail
  export DEBIAN_FRONTEND=noninteractive
  export PATH="${PIXI_HOME}/bin:${HOME}/.pixi/bin:${PATH}"
  apt_ok=0
  for attempt in 1 2 3 4 5; do
    echo "apt attempt ${attempt}/5"
    dpkg --configure -a || true
    apt-get -y -f install || true
    if apt-get update -qq \
      && apt-get install -y -qq --no-install-recommends curl ca-certificates bash; then
      apt_ok=1
      break
    fi
    sleep $((attempt * 4))
  done
  if [[ "${apt_ok}" -ne 1 ]]; then
    echo "FATAL: apt install failed after retries" >&2
    exit 1
  fi
  rm -rf /var/lib/apt/lists/*
  mkdir -p "${PIXI_HOME}/bin"
  if [[ ! -x "${PIXI_HOME}/bin/pixi" ]]; then
    curl -fsSL https://pixi.sh/install.sh | bash
    if [[ -x "${HOME}/.pixi/bin/pixi" && ! -x "${PIXI_HOME}/bin/pixi" ]]; then
      cp -a "${HOME}/.pixi/bin/pixi" "${PIXI_HOME}/bin/pixi"
    fi
  fi
  export PATH="${PIXI_HOME}/bin:${HOME}/.pixi/bin:${PATH}"
  hash -r
  pixi --version

.pixi_cache: &pixi_cache
  key:
    files:
      - pixi.lock
    prefix: "pixi-policyd"
  paths:
    - .cache/rattler/
    - .cache/pixi-home/
  policy: pull-push

.pixi_prepare: &pixi_prepare
  - *pixi_bootstrap
  - export PATH="${PIXI_HOME}/bin:${HOME}/.pixi/bin:${PATH}"
  - rm -rf .pixi/envs
  - pixi install --locked -e ci



# Policy / Cap'n surface — when these change, run mutation.
.mutation_paths: &mutation_paths
  - src/policy.c
  - src/capnp_api.c
  - schema/policy.capnp
  - schema/util.capnp
  - mull.yml
  - tests/test_policy.c
  - tests/test_capnp_ffi.c

# Playground surface — parity / pages when these change.
.playground_paths: &playground_paths
  - playground/**/*
  - policy/**/*
  - src/policy*.c
  - src/capnp_api.c
  - src/policy_trace.*
  - schema/SCHEMA_PIN
  - subprojects/grokos-schema.wrap

build:pixi:
  tags:
    - grokos-heavy
  stage: build
  image: debian:bookworm-slim
  interruptible: true
  cache: *pixi_cache
  before_script: *pixi_prepare
  script:
    - export PATH="${CI_PROJECT_DIR}/.pixi/envs/ci/bin:${PIXI_HOME}/bin:${PATH}"
    - export POLICYD_BIN="${CI_PROJECT_DIR}/build/phronesis"
    - just build
  after_script:
    - df -h || true
    - rm -rf build build-cov build-product docs/build .pixi/envs || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Full static lib for package registry. MR: symbol dry-run. main: upload.
publish:lib:
  tags:
    - grokos-heavy
  stage: build
  image: debian:bookworm-slim
  interruptible: false
  cache: *pixi_cache
  before_script: *pixi_prepare
  script:
    - export PATH="${CI_PROJECT_DIR}/.pixi/envs/ci/bin:${PIXI_HOME}/bin:${PATH}"
    - just publish-lib
  after_script:
    - df -h || true
    - rm -rf build build-cov build-product .pixi/envs || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        POLICYD_PUBLISH_DRY_RUN: "1"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Meson -Db_coverage + gcovr. No percentage gate.
coverage:pixi:
  tags:
    - grokos-heavy
  stage: build
  image: debian:bookworm-slim
  interruptible: true
  cache: *pixi_cache
  before_script: *pixi_prepare
  script:
    - export PATH="${CI_PROJECT_DIR}/.pixi/envs/ci/bin:${PIXI_HOME}/bin:${PATH}"
    - just coverage
  artifacts:
    when: always
    paths:
      - coverage-out/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-out/coverage.xml
    expire_in: 14 days
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  after_script:
    - df -h || true
    # Keep coverage-out/ for artifact upload (runs after this).
    - rm -rf build build-cov .pixi/envs || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Mull on policy/Cap'n. Soft on survivors via mull-runner --allow-surviving
# (Meson run_target); job fails only on install/build/tool errors.
mutation:mull:
  tags:
    - grokos-heavy
  stage: build
  # Mull Cloudsmith packages are Ubuntu-only (not Debian bookworm).
  image: ubuntu:24.04
  interruptible: true
  timeout: 30m
  # Pixi cache + apt .deb archive cache (Ubuntu noble only — do not share with bookworm jobs).
  cache:
    - key:
        files:
          - pixi.lock
        prefix: "pixi-policyd"
      paths:
        - .cache/rattler/
        - .cache/pixi-home/
      policy: pull-push
    - key: "apt-mull-ubuntu-24.04"
      paths:
        - .cache/apt/archives/
      policy: pull-push
  before_script:
    - *pixi_prepare
    # Quiet apt repo (avoid Cloudsmith setup.deb.sh banner / NOPE noise).
    # Cache .debs under .cache/apt/archives so reinstalls skip re-download.
    - export DEBIAN_FRONTEND=noninteractive
    - export APT_ARCHIVES="${CI_PROJECT_DIR}/.cache/apt/archives"
    - mkdir -p "${APT_ARCHIVES}/partial"
    - apt-get update -qq
    - apt-get install -y -qq -o Dir::Cache::Archives="${APT_ARCHIVES}" --no-install-recommends ca-certificates curl gnupg
    - install -d /usr/share/keyrings
    - curl -fsSL https://dl.cloudsmith.io/public/mull-project/mull-stable/gpg.41DB35380DE6BD6F.key | gpg --dearmor -o /usr/share/keyrings/mull-project-mull-stable-archive-keyring.gpg
    - echo 'deb [signed-by=/usr/share/keyrings/mull-project-mull-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/mull-project/mull-stable/deb/ubuntu noble main' > /etc/apt/sources.list.d/mull-stable.list
    - apt-get update -qq
    - apt-get install -y -qq -o Dir::Cache::Archives="${APT_ARCHIVES}" --no-install-recommends clang-19 mull-19
    - rm -rf /var/lib/apt/lists/*
  script:
    # Use pixi env for meson/pkg-config deps only. Do not `pixi run`: that
    # activates conda compilers and overrides CC to gcc, which breaks Mull.
    - PIXI_ENV="${CI_PROJECT_DIR}/.pixi/envs/ci"
    - export PATH="${PIXI_ENV}/bin:${PIXI_HOME}/bin:${PATH}"
    - export PKG_CONFIG_PATH="${PIXI_ENV}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
    - export LD_LIBRARY_PATH="${PIXI_ENV}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
    - export CC=/usr/bin/clang-19
    - bash scripts/ci-seed-schema.sh
    - rm -rf build-mull
    - meson setup build-mull -Dmutation=true -Dbuildtype=debug
    - meson compile -C build-mull mutation
    # IDE reporter is a file; echo survivors into the job log (no triage script).
    - |
      if [ -f build-mull/mull-report/phronesis.txt ]; then
        echo "======== Mull survivors ========"
        cat build-mull/mull-report/phronesis.txt
        echo "======== end Mull survivors ========"
      fi
  artifacts:
    when: always
    paths:
      - build-mull/mull-report/
    expire_in: 14 days
  after_script:
    - df -h || true
    - rm -rf .pixi/envs || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *mutation_paths
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *mutation_paths
    - if: $CI_PIPELINE_SOURCE == "schedule"

playground:wasm:
  tags:
    - grokos-heavy
  stage: build
  image: debian:bookworm-slim
  interruptible: true
  allow_failure: true
  cache: *pixi_cache
  before_script: *pixi_prepare
  script:
    - export PATH="${CI_PROJECT_DIR}/.pixi/envs/ci/bin:${PIXI_HOME}/bin:${PATH}"
    - |
      set -euo pipefail
      if ! command -v emcc >/dev/null 2>&1; then
        echo "emcc not on runner PATH — playground WASM is built on rg.terra" >&2
        echo "PLAYGROUND_WASM_SKIPPED=1" > playground-wasm.env
        exit 0
      fi
      bash scripts/ci-seed-schema.sh
      pixi run playground-wasm
      echo "PLAYGROUND_WASM_SKIPPED=0" > playground-wasm.env
  artifacts:
    when: always
    paths:
      - playground/dist-wasm/
      - playground-wasm.env
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *playground_paths
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *playground_paths
      when: manual
    - when: manual
      allow_failure: true

playground:parity:
  tags:
    - grokos-heavy
  stage: build
  image: debian:bookworm-slim
  interruptible: true
  allow_failure: true
  needs:
    - job: playground:wasm
      optional: true
      artifacts: true
  cache: *pixi_cache
  before_script: *pixi_prepare
  script:
    - export PATH="${CI_PROJECT_DIR}/.pixi/envs/ci/bin:${PIXI_HOME}/bin:${PATH}"
    - |
      set -euo pipefail
      if ! command -v node >/dev/null 2>&1; then
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends nodejs
      fi
      if [[ ! -f playground/dist-wasm/policyd-playground.js ]]; then
        echo "No playground/dist-wasm — using tracked prebuilt assets if present." >&2
      fi
      test -f playground/dist-wasm/policyd-playground.js
      node playground/scripts/parity-node.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *playground_paths
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *playground_paths

# Biome + TypeScript for playground Astro/TS/JS (no emcc, no WASM).
playground:check:
  tags:
    - grokos-heavy
  stage: build
  image: node:22-bookworm-slim
  interruptible: true
  script:
    - cd playground/astro
    - npm ci
    - npm run check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *playground_paths
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *playground_paths

# GitLab Pages — Astro dist; members-only project Pages access.
# Prebuilt playground/dist-wasm/ is tracked so shared runners need no emsdk.
# Always deploy on default branch (do not gate on rules:changes — merge-commit
# path filters skipped the first publish after !30 despite playground landing).
pages:
  tags:
    - grokos-heavy
  stage: deploy
  # Astro 5 needs Node >=20.3; debian bookworm apt node is 18.x and dies mid-build.
  image: node:20-bookworm-slim
  interruptible: true
  needs: []
  before_script:
    - |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends python3 ca-certificates git
      node -v
      npm -v
      test -f playground/dist-wasm/policyd-playground.js
      test -f playground/dist-wasm/policyd-playground.wasm
  script:
    - |
      set -euo pipefail
      # Pin-only tree: seed wrap SoT the same way build:pixi does (meta #142).
      bash scripts/ci-seed-schema.sh
      test -f subprojects/grokos-schema/schema/policy.capnp
      # CI_PAGES_URL is the live Pages origin for this project (path or unique domain).
      # Derive PUBLIC_BASE so Astro asset paths match whatever host form the instance uses.
      if [[ -n "${CI_PAGES_URL:-}" ]]; then
        PUBLIC_BASE="$(python3 -c 'import os; from urllib.parse import urlparse; p=urlparse(os.environ["CI_PAGES_URL"]).path.rstrip("/"); print((p+"/") if p else "/")')"
      else
        # Nested path under top-level group Pages host (trace-analysis/…).
        PUBLIC_BASE="/grokos-packages/grok-policyd/"
      fi
      export PUBLIC_BASE
      echo "CI_PAGES_URL=${CI_PAGES_URL:-<unset>} PUBLIC_BASE=${PUBLIC_BASE}"
      bash playground/scripts/build-site.sh
      mkdir -p public
      cp -a playground/astro/dist/. public/
      test -f public/play/index.html || test -f public/play.html || ls -la public | head -30
      # Surface the URL in the job log for humans.
      echo "PAGES_URL=${CI_PAGES_URL:-https://<pages-host>${PUBLIC_BASE}}"
      echo "PAGES_PLAY=${CI_PAGES_URL:-https://<pages-host>${PUBLIC_BASE}}play/"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

# OpenMandriva packaging: bump Release in grokos-packaging/grok-policyd for this SHA.
# Downstream pipeline commits 0.YYYYMMDDHHMMSS.N and builds RPMs → Pages repo.
# Requires: packaging project allows CI job tokens from this project (clone product);
#           PACKAGING_PUSH_TOKEN on packaging project (push Release bumps).
trigger:packaging:
  stage: deploy
  interruptible: true
  needs:
    - job: build:pixi
  trigger:
    project: trace-analysis/grokos-packaging/grok-policyd
    branch: master
    strategy: depend
  variables:
    UPSTREAM_SHA: $CI_COMMIT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
