# Reproducible via pixi (pixi.lock). Host C library + cmocka tests + docs.
stages: [validate, build]

variables:
  FF_USE_FASTZIP: "true"
  RATTLER_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/rattler
  PIXI_HOME: ${CI_PROJECT_DIR}/.cache/pixi-home

commits:signed:
  stage: validate
  image: python:3.12-alpine
  variables:
    GIT_DEPTH: "100"
  before_script:
    - apk add --no-cache bash curl git
  script:
    - ./scripts/check-signed-commits.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

validate:manifest:
  stage: validate
  image: alpine:3.20
  script:
    - test -f README.md
    - test -f include/grok-policyd/supervisor.h
    - test -f Makefile
    - test -f pixi.toml
    - test -f pixi.lock
    - test -f packaging/grok-policyd.pc.in
    - test -f scripts/check-signed-commits.sh
    - test -f scripts/pixi_env_info.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

build:pixi:
  stage: build
  image: debian:bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - pixi.lock
      prefix: "pixi-policyd"
    paths:
      - .cache/rattler/
      - .cache/pixi-home/
    policy: pull-push
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - export PATH="${PIXI_HOME}/bin:${HOME}/.pixi/bin:${PATH}"
    - |
      set -euo pipefail
      apt_ok=0
      for attempt in 1 2 3 4 5; do
        echo "apt attempt ${attempt}/5"
        dpkg --configure -a || true
        apt-get -y -f install || true
        if apt-get update -qq \
          && apt-get install -y -qq --no-install-recommends curl ca-certificates bash; then
          apt_ok=1
          break
        fi
        sleep $((attempt * 4))
      done
      if [[ "${apt_ok}" -ne 1 ]]; then
        echo "FATAL: apt install failed after retries" >&2
        exit 1
      fi
      rm -rf /var/lib/apt/lists/*
      mkdir -p "${PIXI_HOME}/bin"
      if [[ ! -x "${PIXI_HOME}/bin/pixi" ]]; then
        curl -fsSL https://pixi.sh/install.sh | bash
        if [[ -x "${HOME}/.pixi/bin/pixi" && ! -x "${PIXI_HOME}/bin/pixi" ]]; then
          cp -a "${HOME}/.pixi/bin/pixi" "${PIXI_HOME}/bin/pixi"
        fi
      fi
      export PATH="${PIXI_HOME}/bin:${HOME}/.pixi/bin:${PATH}"
      hash -r
      pixi --version
      rm -rf .pixi/envs
      pixi install --locked -e ci
  script:
    - export PATH="${PIXI_HOME}/bin:${HOME}/.pixi/bin:${PATH}"
    - pixi run -e ci env-info
    - pixi run -e ci build
    - test -f build/libgrok_policyd.a
    - test -f build/libgrok_policyd.so.0.1.0
    - test -f build/grok-policyd.pc
    - ./build/example_minimal
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

docs:pixi:
  stage: build
  image: debian:bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - pixi.lock
      prefix: "pixi-policyd-docs"
    paths:
      - .cache/rattler/
      - .cache/pixi-home/
    policy: pull-push
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - export PATH="${PIXI_HOME}/bin:${HOME}/.pixi/bin:${PATH}"
    - |
      set -euo pipefail
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends curl ca-certificates bash
      rm -rf /var/lib/apt/lists/*
      mkdir -p "${PIXI_HOME}/bin"
      if [[ ! -x "${PIXI_HOME}/bin/pixi" ]]; then
        curl -fsSL https://pixi.sh/install.sh | bash
        if [[ -x "${HOME}/.pixi/bin/pixi" && ! -x "${PIXI_HOME}/bin/pixi" ]]; then
          cp -a "${HOME}/.pixi/bin/pixi" "${PIXI_HOME}/bin/pixi"
        fi
      fi
      export PATH="${PIXI_HOME}/bin:${HOME}/.pixi/bin:${PATH}"
      hash -r
      pixi --version
      rm -rf .pixi/envs
      pixi install --locked -e docs
  script:
    - export PATH="${PIXI_HOME}/bin:${HOME}/.pixi/bin:${PATH}"
    - pixi run -e docs doxygen
    - test -d docs/build/doxygen/xml
    - test -f docs/build/doxygen/xml/index.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
