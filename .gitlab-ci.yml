# Host hygiene: tools just door (signed-commits + secrets).
include:
  - project: 'trace-analysis/grokos-packages/grokos-tools'
    ref: main
    file: '/ci-kit/bootstrap/package-validate.gitlab-ci.yml'

# Reproducible via pixi (pixi.lock). Host C library + cmocka tests + full docs.
stages: [validate, build]


# ENOSPC on grokos-ci-packages host: re-queue so GitLab can land on keel
# (keel still has disk; packages runners fail at docker prepare).
default:
  retry:
    max: 5
    when:
      - runner_system_failure
# Cancel redundant pipelines on the same ref when a newer commit is pushed.
# Jobs must be interruptible: true for running work to stop (not only pending).
workflow:
  auto_cancel:
    on_new_commit: interruptible

variables:
  FF_USE_FASTZIP: "true"
  RATTLER_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/rattler
  PIXI_HOME: ${CI_PROJECT_DIR}/.cache/pixi-home

# Shared apt+pixi bootstrap (same retry shape as grokos-session / build:pixi).
.pixi_bootstrap: &pixi_bootstrap |
  set -euo pipefail
  export DEBIAN_FRONTEND=noninteractive
  export PATH="${PIXI_HOME}/bin:${HOME}/.pixi/bin:${PATH}"
  apt_ok=0
  for attempt in 1 2 3 4 5; do
    echo "apt attempt ${attempt}/5"
    dpkg --configure -a || true
    apt-get -y -f install || true
    if apt-get update -qq \
      && apt-get install -y -qq --no-install-recommends curl ca-certificates bash; then
      apt_ok=1
      break
    fi
    sleep $((attempt * 4))
  done
  if [[ "${apt_ok}" -ne 1 ]]; then
    echo "FATAL: apt install failed after retries" >&2
    exit 1
  fi
  rm -rf /var/lib/apt/lists/*
  mkdir -p "${PIXI_HOME}/bin"
  if [[ ! -x "${PIXI_HOME}/bin/pixi" ]]; then
    curl -fsSL https://pixi.sh/install.sh | bash
    if [[ -x "${HOME}/.pixi/bin/pixi" && ! -x "${PIXI_HOME}/bin/pixi" ]]; then
      cp -a "${HOME}/.pixi/bin/pixi" "${PIXI_HOME}/bin/pixi"
    fi
  fi
  export PATH="${PIXI_HOME}/bin:${HOME}/.pixi/bin:${PATH}"
  hash -r
  pixi --version

.pixi_cache: &pixi_cache
  key:
    files:
      - pixi.lock
    prefix: "pixi-policyd"
  paths:
    - .cache/rattler/
    - .cache/pixi-home/
  policy: pull-push

.pixi_prepare: &pixi_prepare
  - *pixi_bootstrap
  - export PATH="${PIXI_HOME}/bin:${HOME}/.pixi/bin:${PATH}"
  - rm -rf .pixi/envs
  - pixi install --locked -e ci

# Policy / Cap'n surface — when these change, run mutation.
.mutation_paths: &mutation_paths
  - src/policy.c
  - src/capnp_api.c
  - schema/policy.capnp
  - mull.yml
  - tests/test_policy.c
  - tests/test_capnp_ffi.c

build:pixi:
  stage: build
  image: debian:bookworm-slim
  interruptible: true
  cache: *pixi_cache
  before_script: *pixi_prepare
  script:
    - export PATH="${CI_PROJECT_DIR}/.pixi/envs/ci/bin:${PIXI_HOME}/bin:${PATH}"
    - export POLICYD_BIN="${CI_PROJECT_DIR}/build/grok-policyd"
    - just build
  after_script:
    - df -h || true
    - rm -rf build build-cov build-product docs/build .pixi/envs || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Full static lib for package registry. MR: symbol dry-run. main: upload.
publish:lib:
  stage: build
  image: debian:bookworm-slim
  interruptible: false
  cache: *pixi_cache
  before_script: *pixi_prepare
  script:
    - export PATH="${CI_PROJECT_DIR}/.pixi/envs/ci/bin:${PIXI_HOME}/bin:${PATH}"
    - just publish-lib
  after_script:
    - df -h || true
    - rm -rf build build-cov build-product .pixi/envs || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        POLICYD_PUBLISH_DRY_RUN: "1"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Meson -Db_coverage + gcovr. No percentage gate.
coverage:pixi:
  stage: build
  image: debian:bookworm-slim
  interruptible: true
  cache: *pixi_cache
  before_script: *pixi_prepare
  script:
    - export PATH="${CI_PROJECT_DIR}/.pixi/envs/ci/bin:${PIXI_HOME}/bin:${PATH}"
    - just coverage
  artifacts:
    when: always
    paths:
      - coverage-out/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-out/coverage.xml
    expire_in: 14 days
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  after_script:
    - df -h || true
    # Keep coverage-out/ for artifact upload (runs after this).
    - rm -rf build build-cov .pixi/envs || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Mull on policy/Cap'n. Soft on survivors via mull-runner --allow-surviving
# (Meson run_target); job fails only on install/build/tool errors.
mutation:mull:
  stage: build
  # Mull Cloudsmith packages are Ubuntu-only (not Debian bookworm).
  image: ubuntu:24.04
  interruptible: true
  timeout: 30m
  # Pixi cache + apt .deb archive cache (Ubuntu noble only — do not share with bookworm jobs).
  cache:
    - key:
        files:
          - pixi.lock
        prefix: "pixi-policyd"
      paths:
        - .cache/rattler/
        - .cache/pixi-home/
      policy: pull-push
    - key: "apt-mull-ubuntu-24.04"
      paths:
        - .cache/apt/archives/
      policy: pull-push
  before_script:
    - *pixi_prepare
    # Quiet apt repo (avoid Cloudsmith setup.deb.sh banner / NOPE noise).
    # Cache .debs under .cache/apt/archives so reinstalls skip re-download.
    - export DEBIAN_FRONTEND=noninteractive
    - export APT_ARCHIVES="${CI_PROJECT_DIR}/.cache/apt/archives"
    - mkdir -p "${APT_ARCHIVES}/partial"
    - apt-get update -qq
    - apt-get install -y -qq -o Dir::Cache::Archives="${APT_ARCHIVES}" --no-install-recommends ca-certificates curl gnupg
    - install -d /usr/share/keyrings
    - curl -fsSL https://dl.cloudsmith.io/public/mull-project/mull-stable/gpg.41DB35380DE6BD6F.key | gpg --dearmor -o /usr/share/keyrings/mull-project-mull-stable-archive-keyring.gpg
    - echo 'deb [signed-by=/usr/share/keyrings/mull-project-mull-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/mull-project/mull-stable/deb/ubuntu noble main' > /etc/apt/sources.list.d/mull-stable.list
    - apt-get update -qq
    - apt-get install -y -qq -o Dir::Cache::Archives="${APT_ARCHIVES}" --no-install-recommends clang-19 mull-19
    - rm -rf /var/lib/apt/lists/*
  script:
    # Use pixi env for meson/pkg-config deps only. Do not `pixi run`: that
    # activates conda compilers and overrides CC to gcc, which breaks Mull.
    - PIXI_ENV="${CI_PROJECT_DIR}/.pixi/envs/ci"
    - export PATH="${PIXI_ENV}/bin:${PIXI_HOME}/bin:${PATH}"
    - export PKG_CONFIG_PATH="${PIXI_ENV}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
    - export LD_LIBRARY_PATH="${PIXI_ENV}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
    - export CC=/usr/bin/clang-19
    - rm -rf build-mull
    - meson setup build-mull -Dmutation=true -Dbuildtype=debug
    - meson compile -C build-mull mutation
    # IDE reporter is a file; echo survivors into the job log (no triage script).
    - |
      if [ -f build-mull/mull-report/grok-policyd.txt ]; then
        echo "======== Mull survivors ========"
        cat build-mull/mull-report/grok-policyd.txt
        echo "======== end Mull survivors ========"
      fi
  artifacts:
    when: always
    paths:
      - build-mull/mull-report/
    expire_in: 14 days
  after_script:
    - df -h || true
    - rm -rf .pixi/envs || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *mutation_paths
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *mutation_paths
    - if: $CI_PIPELINE_SOURCE == "schedule"
