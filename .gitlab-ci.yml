stages: [validate, test]

# Signed commits required (GrokOS project policy).
commits:signed:
  stage: validate
  image: python:3.12-alpine
  variables:
    GIT_DEPTH: "100"
  before_script:
    - apk add --no-cache bash curl git
  script:
    - ./scripts/check-signed-commits.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

validate:tree:
  stage: validate
  image: alpine:3.20
  script:
    - test -f README.md
    - test -f include/grok-policyd/supervisor.h
    - test -f Makefile
    - if [ -d packaging ]; then test -d packaging; fi
    - echo "package tree OK"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:host:
  stage: test
  image: alpine:3.20
  before_script:
    - apk add --no-cache build-base cmocka-dev pkgconf
  script:
    - make clean test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
