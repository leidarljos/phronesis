# Optional Meson cross file for Emscripten.
# v1 playground build uses direct emcc (playground/wasm/build.sh) instead:
# meson+emscripten + c-capnproto + janet amalg + preload MEMFS is more
# friction than a single emcc link line for the smoke target.
#
# If revisiting Meson cross:
#   meson setup build-playground --cross-file playground/wasm/meson-cross-emscripten.ini \
#     -Dplayground=true
#   meson compile -C build-playground
#
# Requires emcc/emar on PATH (emsdk or conda-forge emscripten).

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'
exe_wrapper = 'node'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[built-in options]
c_args = ['-DGROKOS_POLICYD_PLAYGROUND=1']
c_link_args = ['-sALLOW_MEMORY_GROWTH=1']
